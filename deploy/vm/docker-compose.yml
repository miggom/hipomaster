# HipoMaster: servicios de la VM central (core-01). Ver docs/DESPLIEGUE.md §4.
# Perfiles: (por defecto) núcleo | obs: Langfuse v3 | mid: Ollama 7B local.
# Fijar versiones por digest antes de producción.

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-common: &common
  restart: unless-stopped
  logging: *logging
  environment:
    TZ: ${TZ:-Europe/Madrid}

services:
  postgres:
    <<: *common
    image: pgvector/pgvector:pg16
    environment:
      TZ: ${TZ:-Europe/Madrid}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      HIPO_DB_PASSWORD: ${HIPO_DB_PASSWORD:?}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:?}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD:?}
      SCRAPER_DB_PASSWORD: ${SCRAPER_DB_PASSWORD:?}
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_connections=100"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    ports:
      # Solo para el scraper de edge-04 (ACL de Tailscale limita el origen).
      - "${BIND_IP:?}:5432:5432"
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5

  redis:
    <<: *common
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  litellm:
    <<: *common
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      TZ: ${TZ:-Europe/Madrid}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@postgres:5432/litellm
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      EDGE_01: ${EDGE_01}
      EDGE_02: ${EDGE_02}
      EDGE_03: ${EDGE_03}
      EDGE_04: ${EDGE_04}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://langfuse-web:3000
    volumes: [./litellm/config.yaml:/app/config.yaml:ro]
    ports: ["${BIND_IP:?}:4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: 768m

  langgraph-api:
    <<: *common
    image: ${AGENTS_IMAGE}:${AGENTS_IMAGE_TAG:-latest}
    environment:
      TZ: ${TZ:-Europe/Madrid}
      DATABASE_URI: postgresql://hipomaster:${HIPO_DB_PASSWORD}@postgres:5432/hipomaster
      REDIS_URI: redis://redis:6379/0
      OPENAI_API_BASE: http://litellm:4000
      OPENAI_API_KEY: ${LITELLM_AGENTS_KEY}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGGRAPH_CLOUD_LICENSE_KEY: ${LANGGRAPH_CLOUD_LICENSE_KEY}
      TRACE_MASKING: ${TRACE_MASKING:-strict}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://langfuse-web:3000
    volumes: [docs:/data/docs]   # documentos del cliente cifrados
    ports: ["${BIND_IP:?}:8123:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      litellm: { condition: service_started }
    mem_limit: 1g

  agent-chat-ui:
    <<: *common
    build:
      context: ./agent-chat-ui
      args:
        AGENT_CHAT_UI_REF: ${AGENT_CHAT_UI_REF:-main}
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
        NEXT_PUBLIC_ASSISTANT_ID: hipomaster
    image: hipomaster/agent-chat-ui:local
    ports: ["${BIND_IP:?}:3000:3000"]
    depends_on: [langgraph-api]
    mem_limit: 384m

  uptime-kuma:
    <<: *common
    image: louislam/uptime-kuma:1
    volumes: [kumadata:/app/data]
    ports: ["${BIND_IP:?}:3002:3001"]
    mem_limit: 256m

  # ---------- perfil obs: Langfuse v3 ----------
  langfuse-web:
    <<: *common
    profiles: [obs]
    image: langfuse/langfuse:3
    environment: &langfuse-env
      TZ: ${TZ:-Europe/Madrid}
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      NEXTAUTH_URL: ${LANGFUSE_URL}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://redis:6379/1
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
    ports: ["${BIND_IP:?}:3001:3000"]
    depends_on: [postgres, redis, clickhouse, minio]
    mem_limit: 1g

  langfuse-worker:
    <<: *common
    profiles: [obs]
    image: langfuse/langfuse-worker:3
    environment: *langfuse-env
    depends_on: [postgres, redis, clickhouse, minio]
    mem_limit: 512m

  clickhouse:
    <<: *common
    profiles: [obs]
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes: [chdata:/var/lib/clickhouse]
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    mem_limit: 2g

  minio:
    <<: *common
    profiles: [obs]
    image: minio/minio:latest
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/data]
    mem_limit: 256m

  # ---------- perfil mid: Ollama local (Qwen 7B) ----------
  ollama-mid:
    <<: *common
    profiles: [mid]
    image: ollama/ollama:latest
    environment:
      TZ: ${TZ:-Europe/Madrid}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_CONTEXT_LENGTH: "16384"
    volumes: [ollama:/root/.ollama]
    mem_limit: 6g

volumes:
  pgdata:
  redisdata:
  docs:
  kumadata:
  chdata:
  miniodata:
  ollama:
