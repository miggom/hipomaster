# LiteLLM en modo 100 % local: ninguna API de pago. Ver docs/ALOJAMIENTO_LOCAL.md.
# Activar con LITELLM_CONFIG=config.local.yaml y HIPO_MODO=local en .env.
# Los nombres "frontier" (deepseek-*, claude-*) se mantienen como alias locales
# para que el grafo no cambie: apuntan a mid-local y avisan en el informe.

model_list:
  # ---- edge: fitlet2 ----
  - model_name: edge-chat
    litellm_params: { model: ollama_chat/qwen2.5:3b, api_base: os.environ/EDGE_01 }
  - model_name: edge-chat
    litellm_params: { model: ollama_chat/qwen2.5:3b, api_base: os.environ/EDGE_02 }
  - model_name: edge-chat
    litellm_params: { model: ollama_chat/qwen2.5:3b, api_base: os.environ/EDGE_04 }
    model_info: { id: edge-04-chat }
  - model_name: edge-extract
    litellm_params: { model: ollama_chat/qwen2.5:3b, api_base: os.environ/EDGE_03 }
  - model_name: embeddings
    litellm_params: { model: ollama/nomic-embed-text, api_base: os.environ/EDGE_03 }

  # ---- mid: VM (perfil mid obligatorio en modo local) ----
  - model_name: mid-local
    litellm_params: { model: ollama_chat/qwen2.5:7b, api_base: http://ollama-mid:11434, timeout: 1200 }
  # Reserva: 7B en edge-04 (lento, 1-3 tok/s) si la VM no responde
  - model_name: mid-reserva
    litellm_params: { model: ollama_chat/qwen2.5:7b, api_base: os.environ/EDGE_04, timeout: 1800 }

  # ---- alias de frontier -> local ----
  - model_name: deepseek-flash
    litellm_params: { model: ollama_chat/qwen2.5:7b, api_base: http://ollama-mid:11434, timeout: 1200 }
  - model_name: deepseek-pro
    litellm_params: { model: ollama_chat/qwen2.5:7b, api_base: http://ollama-mid:11434, timeout: 1800 }
  - model_name: claude-haiku
    litellm_params: { model: ollama_chat/qwen2.5:7b, api_base: http://ollama-mid:11434, timeout: 1800 }
  - model_name: claude-sonnet
    litellm_params: { model: ollama_chat/qwen2.5:7b, api_base: http://ollama-mid:11434, timeout: 1800 }

router_settings:
  routing_strategy: least-busy
  num_retries: 1
  timeout: 1800
  allowed_fails: 3
  cooldown_time: 60
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  fallbacks:
    - edge-chat: [mid-local]
    - edge-extract: [mid-local, mid-reserva]
    - mid-local: [mid-reserva]

litellm_settings:
  max_budget: 0             # sin gasto: cualquier modelo de pago añadido por error se rechaza
  budget_duration: 30d
  drop_params: true
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  turn_off_message_logging: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
