# Parámetros orientativos por sector (persona física residente en España).
# Revisar periódicamente. Unidades: ltv_max en %, plazo en años, diferencial en puntos porcentuales sobre vivienda habitual.
version: 0.1
fecha_referencia: 2026-11-01
comun:
