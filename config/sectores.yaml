  trastero:
    ltv_max: 60
    plazo_max: 15
    diferencial_extra: [0.5, 1.5]
  terreno_urbano:
    ltv_max: 60
    plazo_max: 20
    diferencial_extra: [1.0, 2.0]
  terreno_rustico:
    ltv_max: 50
    plazo_max: 15
    diferencial_extra: [1.5, 3.0]
  nave:
    ltv_max: 60
    plazo_max: 20
